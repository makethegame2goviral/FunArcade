XP</small></div><div class=stat><strong>${stats.rounds}</strong><small>Runden</small></div><div class=stat><strong>${stats.best}</strong><small>Bestwert</small></div>`}function saveStats(){localStorage.setItem("neon_stats_v1",JSON.stringify(stats));updateStats();if(user)db.from("arcade_player_data").upsert({user_id:user.id,username,xp:stats.xp,rounds:stats.rounds,best:stats.best},{onConflict:"user_id"})}async function award(points,game,score){stats.xp+=points;stats.rounds++;if(score>stats.best)stats.best=score;saveStats();if(user&&game)db.from("arcade_game_records").upsert({user_id:user.id,username,game_id:game,best_score:score,plays:1},{onConflict:"user_id,game_id"})}async function register(){const name=$("username").value.trim(),email=$("email").value.trim(),password=$("password").value;if(!name||!email||password.length<6)return $("authMsg").textContent="Bitte alle Felder ausfüllen.";const {data,error}=await db.auth.signUp({email,password,options:{data:{username:name}}});if(error)return $("authMsg").textContent=error.message;user=data.user;username=name;enterApp()}async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return $("authMsg").textContent="Bitte E-Mail und Passwort eingeben.";const {data,error}=await db.auth.signInWithPassword({email,password});if(error)return $("authMsg").textContent=error.message;user=data.user;username=user.user_metadata?.username||user.email.split("@")[0];const {data:p}=await db.from("arcade_player_data").select("xp,rounds,best").eq("user_id",user.id).maybeSingle();if(p)stats={xp:p.xp||0,rounds:p.rounds||0,best:p.best||0};enterApp()}function guest(){user=null;username=$("username").value.trim()||"Gast";enterApp()}function enterApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("helloName").textContent=username;$("account").innerHTML=`<span class=muted>${esc(username)}</span> ${user?"<button onclick=logout()>Abmelden</button>":""}`;$("passwordBox").classList.toggle("hidden",!user);renderTabs();updateStats();renderGames()}async function logout(){if(user)await db.auth.signOut();location.reload()}async function changePassword(){const p=$("newPassword").value;if(p.length<6)return $("passwordMsg").textContent="Mindestens 6 Zeichen.";const {error}=await db.auth.updateUser({password:p});$("passwordMsg").textContent=error?error.message:"Passwort geändert ✅";if(!error)$("newPassword").value=""}const games=[["ttt","❎","Tic-Tac-Toe"],["rps","✊","Schere-Stein-Papier"],["memory","🧩","Memory"],["quiz","🧠","Quiz"],["snake","🐍","Snake"],["g2048","🔢","2048"],["reaction","⏱️","Reaktion"],["word","🔤","Wortraten"],["impostor","🕵️","Impostor"],["werwolf","🐺","Werwolf"]];function renderGames(){$("gameGrid").innerHTML=games.map(g=>`<div class=game-card><div style=font-size:38px>${g[1]}</div><h3>${g[2]}</h3><button class=primary onclick=openGame('${g[0]}')>Spielen</button></div>`).join("")}function openGame(id){currentGame=id;const g=games.find(x=>x[0]===id);$("gameArea").innerHTML=`<hr><h2>${g[1]} ${g[2]}</h2><div id=g></div><div class=swipeHint>Wische über das Spiel für Steuerung</div>`;handlers[id]()}const handlers={};handlers.ttt=()=>{let b=Array(9).fill(""),over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const draw=()=>{$("g").innerHTML=`<div class=board>${b.map((v,i)=>`<button class=cell data-i=${i}>${v}</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("button").forEach(x=>x.onclick=()=>play(+x.dataset.i))};const winner=()=>{for(const w of wins)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return b[w[0]];return b.every(Boolean)?"draw":null};const play=i=>{if(over||b[i])return;b[i]="X";let w=winner();draw();if(w)return finish(w);const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);let m=free.find(i=>{b[i]="O";const x=winner()==="O";b[i]="";return x});if(m===undefined)m=free.find(i=>{b[i]="X";const x=winner()==="X";b[i]="";return x});if(m===undefined)m=free[Math.floor(Math.random()*free.length)];b[m]="O";w=winner();draw();if(w)finish(w)};const finish=w=>{over=true;if(w==="X"){$("result").textContent="Du gewinnst! +15 XP";award(15,"ttt",1)}else if(w==="O")$("result").textContent="Computer gewinnt!";else{$("result").textContent="Unentschieden! +5 XP";award(5,"ttt",0)}};draw()};handlers.rps=()=>{$("g").innerHTML=`<div class=row>${["✊","✋","✌️"].map((e,i)=>`<button onclick=play(${i}) style=font-size:34px>${e}</button>`).join("")}</div><div class=result id=result></div>`;window.play=i=>{const c=Math.floor(Math.random()*3);const r=(i-c+3)%3;$("result").textContent=r===0?"Unentschieden!":r===1?"Du gewinnst! +10 XP":"Computer gewinnt!";if(r===1)award(10,"rps",1)}};handlers.memory=()=>{const e=["🍎","🚀","🐶","🌟","🎈","🍕","⚽","🎧","🍎","🚀","🐶","🌟","🎈","🍕","⚽","🎧"].sort(()=>Math.random()-.5);let open=[],found=0;$("g").innerHTML=`<div class=board4>${e.map((x,i)=>`<button class=tile data-i=${i}>?</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(open.length===2||b.textContent!=="?")return;b.textContent=e[i];open.push({i,b});if(open.length===2){if(e[open[0].i]===e[open[1].i]){found++;open=[];if(found===8){$("result").textContent="Alle Paare! +20 XP";award(20,"memory",1)}}else setTimeout(()=>{open.forEach(o=>o.b.textContent="?");open=[]},700)}})};handlers.quiz=()=>{const qs=[["Wie viele Planeten?",["7","8","9"],1],["Hauptstadt von Frankreich?",["Rom","Paris","Madrid"],1],["9 × 7?",["56","63","72"],1],["Welches Tier ist ein Säugetier?",["Hai","Delfin","Forelle"],1],["Welches Gas zum Atmen?",["Sauerstoff","Helium","Wasserstoff"],0]];let i=0,score=0;const show=()=>{if(i>=qs.length){$("g").innerHTML=`<h2>Quiz beendet!</h2><div style=font-size:44px>${score}/${qs.length}</div><button class=primary onclick=openGame('quiz')>Nochmal</button>`;award(score*2+5,"quiz",score);return}const q=qs[i];$("g").innerHTML=`<h3>${q[0]}</h3><div class=row>${q[1].map((a,j)=>`<button data-a=${j}>${a}</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(+b.dataset.a===q[2]){score++;$("result").textContent="Richtig!"}else $("result").textContent="Falsch. Richtig: "+q[1][q[2]];const n=document.createElement("button");n.className="primary";n.textContent="Weiter";n.onclick=()=>{i++;show()};$("g").append(n)})};show()};handlers.snake=()=>{const c=document.createElement("canvas");c.width=300;c.height=300;c.style.maxWidth="100%";$("g").append(c);const x=c.getContext("2d");let s=[{x:7,y:7}],d={x:1,y:0},food={x:12,y:12},score=0,dead=false;window.swipeDir=dir=>{const k={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}}[dir];if(k&&!(k.x===-d.x&&k.y===-d.y))d=k};const loop=setInterval(()=>{if(dead)return;const h={x:(s[0].x+d.x+15)%15,y:(s[0].y+d.y+15)%15};if(s.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(loop);$("g").append(Object.assign(document.createElement("div"),{className:"result",textContent:`Game Over! Punkte: ${score}`}));award(score,"snake",score);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}}else s.pop();x.fillStyle="#fff";x.fillRect(0,0,300,300);x.fillStyle="#ff4fd8";x.fillRect(food.x*20,food.y*20,18,18);x.fillStyle="#4dfcff";s.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18))},120)};handlers.g2048=()=>{let b=Array(16).fill(0);const add=()=>{const f=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(f.length)b[f[Math.floor(Math.random()*f.length)]]=Math.random()<.9?2:4};add();add();const draw=()=>{$("g").innerHTML=`<div class=board4>${b.map(v=>`<div class=tile>${v||""}</div>`).join("")}</div>`};window.swipeDir=dir=>{let changed=false;for(let r=0;r<4;r++){let idx=dir==="left"?[r*4,r*4+1,r*4+2,r*4+3]:dir==="right"?[r*4+3,r*4+2,r*4+1,r*4]:dir==="up"?[r,r+4,r+8,r+12]:[r+12,r+8,r+4,r];let vals=idx.map(i=>b[i]).filter(Boolean);for(let i=0;i<vals.length-1;i++)if(vals[i]===vals[i+1]){vals[i]*=2;vals.splice(i+1,1)}while(vals.length<4)vals.push(0);idx.forEach((v,i)=>{if(b[v]!==vals[i])changed=true;b[v]=vals[i]})}if(changed){add();draw();award(1,"g2048",Math.max(...b))}};draw()};handlers.reaction=()=>{let t;$("g").innerHTML=`<button class=primary id=rb>Start</button><div class=result id=rr></div>`;$("rb").onclick=()=>{$("rr").textContent="Warte…";$("rb").disabled=true;setTimeout(()=>{t=Date.now();$("rb").disabled=false;$("rb").textContent="JETZT!";$("rb").onclick=()=>{$("rr").textContent=`${Date.now()-t} ms`;award(10,"reaction",1000-(Date.now()-t));$("rb").textContent="Nochmal";openGame("reaction")}},1000+Math.random()*2500)}};handlers.word=()=>{const words=["ARCADE","NEON","SPIEL","HANDY","TABLET"];const w=words[Math.floor(Math.random()*words.length)];let shown=w.split("").map(c=>Math.random()<.3?c:"_");const draw=()=>{$("g").innerHTML=`<div style=font-size:32px;letter-spacing:5px>${shown.join(" ")}</div><input id=guess placeholder="Buchstabe"><button class=primary onclick=guess()>Raten</button><div class=result id=result></div>`};window.guess=()=>{const g=$("guess").value.toUpperCase();if(!g)return;if(g===w){$("result").textContent="Richtig! +20 XP";award(20,"word",1);return}shown=w.split("").map((c,i)=>g===c?c:shown[i]);draw();if(!shown.includes("_")){$("result").textContent="Gelöst! +20 XP";award(20,"word",1)}};draw()};handlers.impostor=()=>{const words=["Pizza","Mond","Dino","Schokolade","Fußball"];const w=words[Math.floor(Math.random()*words.length)];$("g").innerHTML=`<p>Gebt das Gerät herum.</p><button class=primary onclick=showRole()>Rolle zeigen</button><div id=role></div>`;window.showRole=()=>{const imp=Math.random()<.2;$("role").innerHTML=`<h2>${imp?"🕵️ IMPOSTOR!":"Wort: "+esc(w)}</h2><button onclick=openGame('impostor')>Neue Runde</button>`;award(5,"impostor",imp?0:1)}};handlers.werwolf=()=>{const roles=["🐺 Werwolf","🔮 Seher","🧙 Hexe","🏡 Dorfbewohner"];const r=roles[Math.floor(Math.random()*roles.length)];$("g").innerHTML=`<p>Deine Rolle:</p><h2>${esc(r)}</h2><button class=primary onclick=openGame('werwolf')>Neue Runde</button>`;award(5,"werwolf",1)};let ts=null;document.addEventListener("touchstart",e=>{ts=e.touches[0]},{passive:true});document.addEventListener("touchend",e=>{if(!ts)return;const dx=e.changedTouches[0].clientX-ts.clientX,dy=e.changedTouches[0].clientY-ts.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");if(currentGame==="snake"||currentGame==="g2048")window.swipeDir&&window.swipeDir(dir);ts=null},{passive:true});async function loadLeaderboard(){const {data,error}=await db.from("arcade_player_data").select("username,xp,level,rounds,best").order("xp",{ascending:false}).limit(50);if(error)return $("leaderboardList").textContent="Fehler: "+error.message;const m=["🥇","🥈","🥉"];$("leaderboardList").innerHTML=`<table><thead><tr><th>#</th><th>Spieler</th><th>XP</th><th>Level</th><th>Runden</th><th>Bestwert</th></tr></thead><tbody>${(data||[]).map((p,i)=>`<tr><td>${m[i]||i+1}</td><td>${esc(p.username)}</td><td>${p.xp}</td><td>${p.level}</td><td>${p.rounds}</td><td>${p.best}</td></tr>`).join("")}</tbody></table>`}async function loadGameBoard(){const {data,error}=await db.from("arcade_game_records").select("game_id,username,best_score,plays").order("game_id").order("best_score",{ascending:false});if(error)return $("gameBoardList").textContent="Fehler: "+error.message;const groups={};(data||[]).forEach(r=>{(groups[r.game_id]??=[]).push(r)});$("gameBoardList").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([game,rows])=>`<div class=game-card><h3>${esc(game)}</h3><table><thead><tr><th>#</th><th>Spieler</th><th>Bestwert</th><th>Plays</th></tr></thead><tbody>${rows.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.username)}</td><td>${r.best_score}</td><td>${r.plays}</td></tr>`).join("")}</tbody></table></div>`).join(""):"<p class=muted>Noch keine Spiel-Highscores.</p>"}</script></
