<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Arcade</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070a16;--line:#2b3760;--cyan:#4dfcff;--pink:#ff4fd8;--muted:#a7b0ce}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#070a16,#131a38,#070a16);background-size:200% 200%;animation:bg 18s ease infinite;color:#f5f7ff;font-family:system-ui,sans-serif}@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}button,input{font:inherit}button{cursor:pointer;border:1px solid #3a4a7a;border-radius:12px;background:#161d38;color:#fff;padding:10px 14px;transition:.2s}button:hover{border-color:var(--cyan);box-shadow:0 0 18px #4dfcff40;transform:translateY(-1px)}.primary{background:linear-gradient(100deg,#5446e8,#b52fd0);border:0;font-weight:800}input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a0f22;color:#fff;margin:6px 0 12px}header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263050;background:#080c1ccc;position:sticky;top:0;backdrop-filter:blur(12px);z-index:5}.logo{font-weight:900;color:var(--cyan)}.logo span{color:var(--pink)}.wrap{max-width:1200px;margin:auto;padding:20px 16px 60px}.panel{background:#11172bdd;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{padding:9px 14px;border-radius:999px}.tab.active{background:linear-gradient(100deg,#5446e8,#b52fd0);border-color:transparent;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:#0b1022;border:1px solid #2b3760;border-radius:14px;padding:14px}.stat strong{display:block;font-size:24px;color:var(--cyan)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.result{min-height:22px;color:var(--cyan);font-weight:700;margin:10px 0}.pill{font-size:12px;color:var(--cyan);border:1px solid #31566b;padding:4px 9px;border-radius:999px}.hidden{display:none!important}#auth{max-width:430px;margin:60px auto}.game-card{background:linear-gradient(145deg,#182042,#0d1225);border:1px solid #2b3760;border-radius:16px;padding:16px;text-align:center}.board{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center}.cell{height:80px;font-size:34px;background:#151c35;border:1px solid #36436b}.mem{height:70px;font-size:26px}.board4{display:grid;grid-template-columns:repeat(4,70px);gap:6px;justify-content:center}.tile{height:70px;display:grid;place-items:center;background:#151c35;border-radius:10px;font-weight:800}canvas{background:#fff;border-radius:12px;max-width:100%}footer{text-align:center;padding:30px;color:var(--muted)}</style></head><body><header><div class="logo">NEON <span>ARCADE</span></div><div id="account"></div></header><main class="wrap"><section id="auth" class="panel"><h2>Anmelden</h2><input id="username" placeholder="Spielername"><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><div class=row><button class=primary onclick=register()>Registrieren</button><button onclick=login()>Anmelden</button><button onclick=guest()>Gast spielen</button></div><div id=authMsg class=result></div></section><section id=app class=hidden><div class=tabs id=tabs></div><section id=home class=panel><h1>ENTER THE <span style=color:var(--pink)>ARCADE.</span></h1><div class=grid id=stats></div><div id=passwordBox class=hidden><h3>🔑 Passwort ändern</h3><input id=newPassword type=password placeholder="Neues Passwort"><button class=primary onclick=changePassword()>Passwort ändern</button><div id=passwordMsg class=result></div></div></section><section id=games class=panel><h2>🎮 Spiele</h2><div class=grid id=gameGrid></div><div id=gameArea></div></section><section id=leaderboard class=panel hidden><h2>🏆 Rangliste</h2><div id=leaderboardList></div><button onclick=loadLeaderboard()>Aktualisieren</button></section><section id=gameboard class=panel hidden><h2>🎮 Rangliste pro Spiel</h2><div id=gameBoardList></div><button onclick=loadGameBoard()>Aktualisieren</button></section></section></main><footer><a href=v4.html><button class=primary>🛡️ Admin-Portal</button></a><p class=muted>Das Admin-Portal prüft selbst, ob du Haupt- oder Mini-Admin bist.</p></footer><script>"use strict";const SUPABASE_URL="https://qznkudfhmegfriwqdvmj.supabase.co",SUPABASE_KEY="sb_publishable_CPz52i2XcyThttYOrlKMAw_Pd3PYRmB";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let user=null,username="Gast",stats={xp:0,rounds:0,best:0};const tabs=["home","games","leaderboard","gameboard"];const labels={home:"🏠 Start",games:"🎮 Spiele",leaderboard:"🏆 Rangliste",gameboard:"🎮 Spiel-Rangliste"};function renderTabs(){$("tabs").innerHTML=tabs.map(t=>`<button class="tab ${t==="home"?"active":""}" data-tab="${t}">${labels[t]}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tabs.forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));if(b.dataset.tab==="leaderboard")loadLeaderboard();if(b.dataset.tab==="gameboard")loadGameBoard()})}function updateStats(){$("stats").innerHTML=`<div class=stat><strong>${stats.xp}</strong><small>XP</small></div><div class=stat><strong>${stats.rounds}</strong><small>Runden</small></div><div class=stat><strong>${stats.best}</strong><small>Bestwert</small></div>`}function saveStats(){localStorage.setItem("neon_stats_v1",JSON.stringify(stats));updateStats();if(user)db.from("arcade_player_data").upsert({user_id:user.id,username,xp:stats.xp,rounds:stats.rounds,best:stats.best},{onConflict:"user_id"})}async function award(points,game,score){stats.xp+=points;stats.rounds++;if(score>stats.best)stats.best=score;saveStats();if(user&&game)db.from("arcade_game_records").upsert({user_id:user.id,username,game_id:game,best_score:score,plays:1},{onConflict:"user_id,game_id"})}async function register(){const name=$("username").value.trim(),email=$("email").value.trim(),password=$("password").value;if(!name||!email||password.length<6)return $("authMsg").textContent="Bitte alle Felder ausfüllen.";const {data,error}=await db.auth.signUp({email,password,options:{data:{username:name}}});if(error)return $("authMsg").textContent=error.message;user=data.user;username=name;enterApp()}async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return $("authMsg").textContent="Bitte E-Mail und Passwort eingeben.";const {data,error}=await db.auth.signInWithPassword({email,password});if(error)return $("authMsg").textContent=error.message;user=data.user;username=user.user_metadata?.username||user.email.split("@")[0];const {data:p}=await db.from("arcade_player_data").select("xp,rounds,best").eq("user_id",user.id).maybeSingle();if(p){stats={xp:p.xp||0,rounds:p.rounds||0,best:p.best||0}}enterApp()}function guest(){user=null;username=$("username").value.trim()||"Gast";enterApp()}function enterApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("account").innerHTML=`<span class=muted>${esc(username)}</span> ${user?"<button onclick=logout()>Abmelden</button>":""}`;$("passwordBox").classList.toggle("hidden",!user);renderTabs();updateStats();renderGames()}async function logout(){if(user)await db.auth.signOut();location.reload()}async function changePassword(){const p=$("newPassword").value;if(p.length<6)return $("passwordMsg").textContent="Mindestens 6 Zeichen.";const {error}=await db.auth.updateUser({password:p});$("passwordMsg").textContent=error?error.message:"Passwort geändert ✅";if(!error)$("newPassword").value=""}const games=[["ttt","❎","Tic-Tac-Toe"],["rps","✊","Schere-Stein-Papier"],["memory","🧩","Memory"],["quiz","🧠","Quiz"],["snake","🐍","Snake"],["reaction","⏱️","Reaktion"],["g2048","🔢","2048"],["word","🔤","Wortraten"],["impostor","🕵️","Impostor"],["werwolf","🐺","Werwolf"]];function renderGames(){$("gameGrid").innerHTML=games.map(g=>`<div class=game-card><div style=font-size:40px>${g[1]}</div><h3>${g[2]}</h3><button class=primary onclick=openGame('${g[0]}')>Spielen</button></div>`).join("")}function openGame(id){const g=games.find(x=>x[0]===id);$("gameArea").innerHTML=`<hr><h2>${g[1]} ${g[2]}</h2><div id=g></div>`;handlers[id]()}const handlers={};handlers.ttt=()=>{let b=Array(9).fill(""),over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const draw=()=>{$("g").innerHTML=`<div class=board>${b.map((v,i)=>`<button class=cell data-i=${i}>${v}</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("button").forEach(x=>x.onclick=()=>play(+x.dataset.i))};const winner=()=>{for(const w of wins)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return b[w[0]];return b.every(Boolean)?"draw":null};const play=i=>{if(over||b[i])return;b[i]="X";let w=winner();draw();if(w)return finish(w);const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);let m=free.find(i=>{b[i]="O";const x=winner()==="O";b[i]="";return x});if(m===undefined)m=free.find(i=>{b[i]="X";const x=winner()==="X";b[i]="";return x});if(m===undefined)m=free[Math.floor(Math.random()*free.length)];b[m]="O";w=winner();draw();if(w)finish(w)};const finish=w=>{over=true;if(w==="X"){$("result").textContent="Du gewinnst! +15 XP";award(15,"ttt",1)}else if(w==="O")$("result").textContent="Computer gewinnt!";else{$("result").textContent="Unentschieden! +5 XP";award(5,"ttt",0)}};draw()};handlers.rps=()=>{$("g").innerHTML=`<div class=row>${["✊","✋","✌️"].map((e,i)=>`<button onclick=play(${i}) style=font-size:34px>${e}</button>`).join("")}</div><div class=result id=result></div>`;window.play=i=>{const c=Math.floor(Math.random()*3);const r=(i-c+3)%3;$("result").textContent=r===0?"Unentschieden!":r===1?"Du gewinnst! +10 XP":"Computer gewinnt!";if(r===1)award(10,"rps",1)}};handlers.memory=()=>{const e=["🍎","🚀","🐶","🌟","🎈","🍕","⚽","🎧","🍎","🚀","🐶","🌟","🎈","🍕","⚽","🎧"].sort(()=>Math.random()-.5);let open=[],found=0;$("g").innerHTML=`<div class=board4>${e.map((x,i)=>`<button class=mem data-i=${i}>?</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(open.length===2||b.textContent!=="?")return;b.textContent=e[i];open.push({i,b});if(open.length===2){if(e[open[0].i]===e[open[1].i]){found++;open=[];if(found===8){$("result").textContent="Alle Paare gefunden! +20 XP";award(20,"memory",1)}}else setTimeout(()=>{open.forEach(o=>o.b.textContent="?");open=[]},700)}})};handlers.quiz=()=>{const qs=[["Wie viele Planeten?",["7","8","9"],1],["Hauptstadt von Frankreich?",["Rom","Paris","Madrid"],1],["9 × 7?",["56","63","72"],1],["Welches Tier ist ein Säugetier?",["Hai","Delfin","Forelle"],1],["Welches Gas zum Atmen?",["Sauerstoff","Helium","Wasserstoff"],0]];let i=0,score=0;const show=()=>{if(i>=qs.length){$("g").innerHTML=`<h2>Quiz beendet!</h2><div style=font-size:50px>${score}/${qs.length}</div><button class=primary onclick=openGame('quiz')>Nochmal</button>`;award(score*2+5,"quiz",score);return}const q=qs[i];$("g").innerHTML=`<h3>${q[0]}</h3><div class=row>${q[1].map((a,j)=>`<button data-a=${j}>${a}</button>`).join("")}</div><div class=result id=result></div>`;$("g").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(+b.dataset.a===q[2]){score++;$("result").textContent="Richtig!"}else $("result").textContent="Falsch. Richtig: "+q[1][q[2]];const n=document.createElement("button");n.className="primary";n.textContent="Weiter";n.onclick=()=>{i++;show()};$("g").append(n)})};show()};handlers.snake=()=>{const c=document.createElement("canvas");c.width=400;c.height=400;$("g").append(c);const x=c.getContext("2d");let s=[{x:10,y:10}],d={x:1,y:0},food={x:15,y:15},score=0,dead=false;const loop=setInterval(()=>{if(dead)return;const h={x:(s[0].x+d.x+20)%20,y:(s[0].y+d.y+20)%20};if(s.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(loop);$("g").append(Object.assign(document.createElement("div"),{className:"result",textContent:`Game Over! Punkte: ${score}`}));award(score,"snake",score);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else s.pop();x.fillStyle="#fff";x.fillRect(0,0,400,400);x.fillStyle="#ff4fd8";x.fillRect(food.x*20,food.y*20,18,18);x.fillStyle="#4dfcff";s.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18))},100);document.onkeydown=e=>{const k={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}}[e.key];if(k){e.preventDefault();d=k}}};handlers.reaction=()=>{let t;$("g").innerHTML=`<button class=primary id=rb>Start</button><div class=result id=rr></div>`;$("rb").onclick=()=>{$("rr").textContent="Warte…";$("rb").disabled=true;setTimeout(()=>{t=Date.now();$("rb").disabled=false;$("rb").textContent="JETZT!";$("rb").onclick=()=>{$("rr").textContent=`${Date.now()-t} ms`;award(10,"reaction",1000-(Date.now()-t));$("rb").textContent="Nochmal";openGame("reaction")}},1000+Math.random()*2500)}};handlers.g2048=()=>{let b=Array(16).fill(0);const add=()=>{const f=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(f.length)b[f[Math.floor(Math.random()*f.length)]]=Math.random()<.9?2:4};add();add();const draw=()=>{$("g").innerHTML=`<div class=board4>${b.map(v=>`<div class=tile>${v||""}</div>`).join("")}</div><p class=muted>Pfeiltasten oder W/A/S/D</p>`};const move=dir=>{let changed=false;for(let r=0;r<4;r++){let idx=dir==="left"?[r*4,r*4+1,r*4+2,r*4+3]:dir==="right"?[r*4+3,r*4+2,r*4+1,r*4]:dir==="up"?[r,r+4,r+8,r+12]:[r+12,r+8,r+4,r];let vals=idx.map(i=>b[i]).filter(Boolean);for(let i=0;i<vals.length-1;i++)if(vals[i]===vals[i+1]){vals[i]*=2;vals.splice(i+1,1)}while(vals.length<4)vals.push(0);idx.forEach((v,i)=>{if(b[v]!==vals[i])changed=true;b[v]=vals[i]})}if(changed){add();draw();award(1,"g2048",Math.max(...b))}};document.onkeydown=e=>{const k={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key];if(k){e.preventDefault();move(k)}};draw()};handlers.word=()=>{const words=["JAVASCRIPT","ARCADE","NEON","SPIEL","COMPUTER"];const w=words[Math.floor(Math.random()*words.length)];let shown=w.split("").map(c=>Math.random()<.3?c:"_");const draw=()=>{$("g").innerHTML=`<div style=font-size:40px;letter-spacing:6px>${shown.join(" ")}</div><input id=guess placeholder="Buchstabe oder Wort"><button class=primary onclick=guess()>Raten</button><div class=result id=result></div>`};window.guess=()=>{const g=$("guess").value.toUpperCase();if(!g)return;if(g===w){$("result").textContent="Richtig! +20 XP";award(20,"word",1);return}shown=w.split("").map((c,i)=>g===c?c:shown[i]);draw();if(!shown.includes("_")){$("result").textContent="Gelöst! +20 XP";award(20,"word",1)}};draw()};handlers.impostor=()=>{const words=["Pizza","Mond","Dino","Schokolade","Fußball"];const w=words[Math.floor(Math.random()*words.length)];$("g").innerHTML=`<p>Gebt das Gerät herum. Jeder sieht das Wort, ein Impostor nicht.</p><button class=primary onclick=showRole()>Rolle zeigen</button><div id=role></div>`;window.showRole=()=>{const imp=Math.random()<.2;$("role").innerHTML=`<h2>${imp?"🕵️ DU BIST IMPOSTOR!":"Wort: "+esc(w)}</h2><button onclick=openGame('impostor')>Neue Runde</button>`;award(5,"impostor",imp?0:1)}};handlers.werwolf=()=>{const roles=["🐺 Werwolf","🔮 Seher","🧙 Hexe","🏡 Dorfbewohner"];const r=roles[Math.floor(Math.random()*roles.length)];$("g").innerHTML=`<p>Deine Rolle:</p><h2>${esc(r)}</h2><button class=primary onclick=openGame('werwolf')>Neue Runde</button>`;award(5,"werwolf",1)};async function loadLeaderboard(){const {data,error}=await db.from("arcade_player_data").select("username,xp,level,rounds,best").order("xp",{ascending:false}).limit(50);if(error)return $("leaderboardList").textContent="Fehler: "+error.message;const m=["🥇","🥈","🥉"];$("leaderboardList").innerHTML=`<table><thead><tr><th>#</th><th>Spieler</th><th>XP</th><th>Level</th><th>Runden</th><th>Bestwert</th></tr></thead><tbody>${(data||[]).map((p,i)=>`<tr><td>${m[i]||i+1}</td><td>${esc(p.username)}</td><td>${p.xp}</td><td>${p.level}</td><td>${p.rounds}</td><td>${p.best}</td></tr>`).join("")}</tbody></table>`}async function loadGameBoard(){const {data,error}=await db.from("arcade_game_records").select("game_id,username,best_score,plays").order("game_id").order("best_score",{ascending:false});if(error)return $("gameBoardList").textContent="Fehler: "+error.message;const groups={};(data||[]).forEach(r=>{(groups[r.game_id]??=[]).push(r)});$("gameBoardList").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([game,rows])=>`<div class=game-card><h3>${esc(game)}</h3><table><thead><tr><th>#</th><th>Spieler</th><th>Bestwert</th><th>Plays</th></tr></thead><tbody>${rows.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.username)}</td><td>${r.best_score}</td><td>${r.plays}</td></tr>`).join("")}</tbody></table></div>`).join(""):"<p class=muted>Noch keine Spiel-Highscores.</p>"}</script></body></html>
