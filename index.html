<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Arcade</title>
<style>
:root {
  --bg:#090b18; --panel:#131832; --panel2:#1b2242;
  --purple:#8b6cff; --cyan:#31d8f3; --pink:#ff5ac8;
  --green:#56e6ad; --text:#f5f6ff; --muted:#a5afd1;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at top,#20204b,var(--bg) 60%);
  color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh
}
button,input,select{font:inherit}
button{cursor:pointer}
header{text-align:center;padding:28px 16px 12px}
.logo{font-size:clamp(28px,5vw,45px);font-weight:1000;letter-spacing:-2px}
.logo span{color:var(--cyan);text-shadow:0 0 22px #31d8f377}
.subtitle{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:16px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 25px}
button,.btn{
  border:1px solid #394267;border-radius:12px;padding:11px 15px;
  background:var(--panel2);color:white;font-weight:750;
  transition:.18s
}
button:hover{border-color:var(--cyan);transform:translateY(-1px)}
.primary{background:linear-gradient(110deg,var(--purple),#398af6);border:0}
.secondary{background:#171c35}
input,select{
  background:#090e21;color:white;border:1px solid #394267;
  border-radius:10px;padding:12px;width:100%;margin:6px 0 12px
}
label{font-size:12px;color:var(--muted)}
h1,h2,h3{letter-spacing:-.5px}
.hero,.panel,.game{
  background:linear-gradient(145deg,#171c3a,#0f1328);
  border:1px solid #30385e;border-radius:20px;padding:22px;margin-bottom:16px
}
.hero{text-align:center;padding:35px 20px;background:
  radial-gradient(ellipse at top,#7557ff30,transparent 70%),
  linear-gradient(145deg,#171c3a,#0f1328)}
.hero h1{font-size:clamp(27px,5vw,43px);margin:8px}
.hero p,.muted{color:var(--muted);line-height:1.6;font-size:13px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.gamecard{
  background:linear-gradient(145deg,#1b2243,#10152b);
  border:1px solid #30385e;border-radius:16px;padding:18px;
  text-align:left;color:white;min-height:160px
}
.gamecard .emoji{font-size:36px}
.gamecard h3{margin:12px 0 5px}
.gamecard p{font-size:12px;color:var(--muted);line-height:1.5}
.gamecard small{color:var(--cyan)}
.gamearea{text-align:center}
.big{font-size:clamp(25px,5vw,39px);font-weight:950;overflow-wrap:anywhere}
.secret{
  min-height:155px;display:grid;place-items:center;
  margin:18px 0;padding:22px;border:1px solid #6558a9;
  border-radius:18px;background:radial-gradient(ellipse at top,#8b6cff35,transparent 70%),#111731;
  user-select:none
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}
.grid button{min-height:48px}
.progress{height:7px;background:#252b4b;border-radius:10px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}
.notice{background:#10162d;border:1px solid #30385e;padding:13px;border-radius:12px;text-align:left;color:var(--muted);font-size:12px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.row>*{flex:1}
.result{padding:16px;background:#10162d;border:1px solid #394267;border-radius:12px;margin:14px 0;line-height:1.7}
.tic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:18px auto}
.tic button{aspect-ratio:1;font-size:35px;font-weight:900;background:#1a2140}
.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:400px;margin:18px auto}
.memory button{aspect-ratio:1;font-size:25px;padding:3px}
canvas{width:100%;height:300px;background:white;border-radius:12px;touch-action:none;cursor:crosshair}
footer{text-align:center;color:#697398;font-size:11px;padding:20px}
@media(max-width:520px){
  main{padding:12px}.hero,.panel,.game{padding:16px}
  .grid{grid-template-columns:1fr 1fr}
  .secret{min-height:135px}
}
</style>
</head>
<body>
<header>
  <div class="logo">NEON <span>ARCADE</span></div>
  <div class="subtitle">Play together. Bluff together. Win together.</div>
</header>

<main>
  <section class="hero">
    <div>✨ DEINE ARCADE · DEINE REGELN</div>
    <h1>Ready. Set. <span style="color:var(--cyan)">Play!</span></h1>
    <p>Neun Spiele für deine Crew – vom geheimen Impostor bis zum großen Werwolf-Finale.</p>
    <div class="row">
      <button class="primary" onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">Spiele entdecken ↓</button>
      <button onclick="showStats()">🏆 Meine Punkte</button>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <div><label>Spielername (optional)</label><input id="playerName" placeholder="Dein Name"></div>
      <div><label>Deine Punkte</label><div class="big" id="score">0 XP</div></div>
      <div><label>Gespielte Runden</label><div class="big" id="played">0</div></div>
    </div>
  </section>

  <h2 id="library">🎮 Alle Spiele</h2>
  <section class="games" id="games"></section>

  <section class="game" id="game" style="display:none">
    <div class="row" style="justify-content:space-between">
      <h2 id="gameTitle">Spiel</h2>
      <button onclick="closeGame()">✕ Schließen</button>
    </div>
    <p id="gameDesc" class="muted"></p>
    <div class="gamearea" id="area"></div>
  </section>
</main>

<footer>NEON ARCADE · Lokale Spielesammlung · Keine Online-Verbindung erforderlich</footer>

<script>
const games=[
 {id:'impostor',emoji:'🕵️',name:'Impostor',desc:'Geheimes Wort, Bluffen und Abstimmen.',mode:'3–12 Spieler'},
 {id:'werewolf',emoji:'🌕',name:'Werwolf',desc:'Geheime Rollen, Nachtaktionen und Dorfabstimmung.',mode:'5–20 Spieler'},
 {id:'tic',emoji:'❎',name:'Tic-Tac-Toe',desc:'Klassisches Duell für zwei Personen.',mode:'2 Spieler'},
 {id:'quiz',emoji:'⚡',name:'Quiz Battle',desc:'Teste dein Wissen mit Quizfragen.',mode:'Solo'},
 {id:'draw',emoji:'🎨',name:'Zeichnen & Raten',desc:'Zeichne einen Begriff und lass die Crew raten.',mode:'Party'},
 {id:'memory',emoji:'🧠',name:'Memory Clash',desc:'Finde alle Kartenpaare.',mode:'Solo'},
 {id:'rps',emoji:'✊',name:'Schere-Stein-Papier',desc:'Duell gegen den Computer.',mode:'1 vs CPU'},
 {id:'word',emoji:'🔤',name:'Wortduell',desc:'Errate ein geheimes Wort Buchstabe für Buchstabe.',mode:'Solo'},
 {id:'truth',emoji:'🎲',name:'Party Fragen',desc:'Lustige Fragen und harmlose Aufgaben.',mode:'Party'}
];

let xp=Number(localStorage.getItem('neon_xp')||0);
let rounds=Number(localStorage.getItem('neon_rounds')||0);
let currentGame='';
let state={};
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function updateStats(){
 $('score').textContent=xp+' XP';
 $('played').textContent=rounds;
 localStorage.setItem('neon_xp',xp);
 localStorage.setItem('neon_rounds',rounds);
}
function reward(points=20){
 xp+=points;rounds++;updateStats();
}
function showStats(){
 alert('Dein Arcade-Stand\n\n'+xp+' XP\n'+rounds+' gespielte Runden');
}
function openGame(id){
 currentGame=id;
 const g=games.find(x=>x.id===id);
 $('game').style.display='block';
 $('gameTitle').textContent=g.emoji+' '+g.name;
 $('gameDesc').textContent=g.desc;
 $('game').scrollIntoView({behavior:'smooth'});
 ({
  impostor:startImpostor,
  werewolf:startWerewolf,
  tic:startTic,
  quiz:startQuiz,
  draw:startDraw,
  memory:startMemory,
  rps:startRPS,
  word:startWord,
  truth:startTruth
 }[id])();
}
function closeGame(){$('game').style.display='none'}
function renderGames(){
 $('games').innerHTML=games.map(g=>`
 <button class="gamecard" onclick="openGame('${g.id}')">
  <div class="emoji">${g.emoji}</div><h3>${g.name}</h3>
  <p>${g.desc}</p><small>▶ Spielen · ${g.mode}</small>
 </button>`).join('');
}
function screen(html){$('area').innerHTML=html}
function btn(label,fn,cls='primary'){
 return `<button class="${cls}" onclick="${fn}">${label}</button>`;
}

/* 1. IMPOSTOR */
function startImpostor(){
 screen(`<div class="notice">Jede Person sieht ihre Karte geheim. Danach folgen Hinweise, Diskussion und Abstimmung. Wird der Impostor enttarnt, darf er das Wort erraten.</div>
 <label>Spielerzahl (3–12)</label><input id="impN" type="number" min="3" max="12" value="6">
 ${btn('Geheime Karten verteilen →','dealImpostor()')}`);
}
function dealImpostor(){
 let n=Math.max(3,Math.min(12,+$('impN').value||6));
 state={n,i:0,bad:Math.floor(Math.random()*n),word:pick([
 'Pizza','Dinosaurier','Schule','Strand','Popcorn','Fahrrad',
 'Schokolade','Weltraum','Fußball','Kino','Eiscreme','Roboter',
 'Zahnbürste','Wasserfall','Flughafen','Pinguin'
 ]),shown:false};
 impCard();
}
function impCard(){
 screen(`<div class="progress"><div style="width:${state.i/state.n*100}%"></div></div>
 <p>Geheime Karte ${state.i+1} von ${state.n}</p>
 <div class="secret" onclick="revealImp()"><div><div class="big">🔒</div><p>Tippen zum Aufdecken</p></div></div>
 ${btn('Karte gesehen – weiter →','nextImp()','secondary')}`);
 $('area').lastElementChild.disabled=true;
}
function revealImp(){
 if(state.shown)return;
 state.shown=true;
 $('area').querySelector('.secret').innerHTML=
 `<div><div class="big">${state.i===state.bad?'🕵️':'🗝️'}</div>
 <div class="big">${state.i===state.bad?'DU BIST DER IMPOSTOR':state.word}</div>
 <p>${state.i===state.bad?'Du kennst das Wort nicht. Bluffe!':'Merke dir das geheime Wort.'}</p></div>`;
 $('area').lastElementChild.disabled=false;
}
function nextImp(){
 if(!state.shown)return;
 if(state.i+1<state.n){state.i++;state.shown=false;impCard();return}
 screen(`<div class="big">💬 Hinweisrunde</div>
 <p>Jede Person nennt reihum einen Hinweis. Sagt nicht direkt das Wort! Diskutiert, wer blufft.</p>
 ${btn('Zur Abstimmung →','impVoteScreen()')}`);
}
function impVoteScreen(){
 screen(`<h3>Wer ist der Impostor?</h3><div class="grid">${
 Array.from({length:state.n},(_,i)=>`<button onclick="impVote(${i})">👤 Spieler ${i+1}</button>`).join('')
 }</div>`);
}
function impVote(i){
 state.caught=i===state.bad;
 screen(`<div class="big">${state.caught?'🎯':'😈'}</div>
 <h3>${state.caught?'Impostor erwischt!':'Falsch abgestimmt!'}</h3>
 <div class="result">Spieler ${i+1} war ${state.caught?'der Impostor':'unschuldig'}.<br>
 Das geheime Wort war <b>${state.word}</b>.</div>
 ${state.caught?`<label>Impostor: Errate das Wort</label><input id="impGuess" placeholder="Dein Tipp">
 ${btn('Tipp prüfen','finishImp()')}`:btn('Ergebnis ansehen','finishImp()')}`);
}
function finishImp(){
 let guess=($('impGuess')?.value||'').trim().toLowerCase();
 let crew=state.caught&&guess!==state.word.toLowerCase();
 screen(`<div class="big">${crew?'🏆':'😈'}</div>
 <h2>${crew?'Die Crew gewinnt!':'Der Impostor gewinnt!'}</h2>
 <p>Der Impostor war Spieler ${state.bad+1}. Das Wort war ${state.word}.</p>
 ${btn('Neue Runde ↻',"openGame('impostor')")}`);
 reward(crew?45:20);
}

/* 2. WERWOLF */
function startWerewolf(){
 screen(`<div class="notice">
 🐺 Werwölfe versuchen, das Dorf zu übernehmen.<br>
 🔮 Seherin kann nachts Rollen prüfen.<br>
 🧙 Hexe kann ein Opfer retten oder jemanden vergiften.<br>
 🏹 Jäger nimmt beim Ausscheiden eine Person mit.<br>
 🦹 Dieb tauscht seine Rolle mit einer anderen Person.<br>
 😉 Blinzel-Mädchen darf heimlich eine Rolle ansehen.<br>
 💘 Amor wählt zwei Verliebte.
 </div>
 <label>Spielerzahl (5–20)</label><input id="wolfN" type="number" min="5" max="20" value="8">
 ${btn('Rollen verdeckt verteilen →','dealWolf()')}`);
}
function dealWolf(){
 let n=Math.max(5,Math.min(20,+$('wolfN').value||8));
 let roles=Array(n).fill('👤 Dorfbewohner');
 let special=[];
 for(let i=0;i<(n>=13?3:2);i++)special.push('🐺 Werwolf');
 special.push('🔮 Seherin');
 if(n>=7)special.push('🧙 Hexe');
 if(n>=8)special.push('🏹 Jäger');
 if(n>=9)special.push('🦹 Dieb');
 if(n>=10)special.push('😉 Blinzel-Mädchen');
 if(n>=11)special.push('💘 Amor');
 special.forEach((r,i)=>roles[i]=r);
 state={n,roles:shuffle(roles),i:0,shown:false,out:[],night:1,dead:null,poison:null,usedPoison:false,usedSave:false};
 wolfCard();
}
function wolfCard(){
 screen(`<div class="progress"><div style="width:${state.i/state.n*100}%"></div></div>
 <p>Geheime Rolle · Spieler ${state.i+1} von ${state.n}</p>
 <div class="secret" onclick="revealWolf()"><div><div class="big">🔒</div><p>Nur die Person am Zug schaut!</p></div></div>
 ${btn('Karte verdecken – weiter →','nextWolf()','secondary')}`);
 $('area').lastElementChild.disabled=true;
}
function revealWolf(){
 if(state.shown)return;
 state.shown=true;
 $('area').querySelector('.secret').innerHTML=
 `<div><div class="big">${state.roles[state.i].split(' ')[0]}</div>
 <div class="big">${esc(state.roles[state.i].substring(2))}</div>
 <p>Merke dir deine Rolle. Verrate sie nicht leichtfertig.</p></div>`;
 $('area').lastElementChild.disabled=false;
}
function nextWolf(){
 if(!state.shown)return;
 if(state.i+1<state.n){state.i++;state.shown=false;wolfCard();return}
 nightIntro();
}
function nightIntro(){
 screen(`<div class="big">🌘 Nacht ${state.night}</div>
 <p>Alle schließen die Augen. Die Spielleitung führt die Nachtaktionen nacheinander aus.</p>
 ${btn('Nachtaktionen starten →','nightScreen()')}`);
}
function nightScreen(){
 screen(`<h3>Welche Rolle ist dran?</h3><p class="muted">Wählt die Aktion passend zur Rolle. Nicht vorhandene Rollen überspringen.</p>
 <div class="grid">
 ${['🐺 Werwölfe','🔮 Seherin','🧙 Hexe','🦹 Dieb','😉 Blinzel-Mädchen','💘 Amor'].map((r,i)=>`<button onclick="nightRole(${i})">${r}</button>`).join('')}
 </div>${btn('Nacht beenden →','dayIntro()','secondary')}`);
}
function alivePlayers(){return Array.from({length:state.n},(_,i)=>i).filter(i=>!state.out.includes(i))}
function targetScreen(title,callback,exclude=[]){
 let alive=alivePlayers().filter(i=>!exclude.includes(i));
 screen(`<h3>${title}</h3><div class="grid">${
 alive.map(i=>`<button onclick="${callback}(${i})">👤 Spieler ${i+1}</button>`).join('')
 }</div>${btn('Überspringen','nightScreen()','secondary')}`);
}
function nightRole(k){
 state.action=k;
 if(k===0)targetScreen('🐺 Werwölfe wählen ein Opfer','nightTarget');
 if(k===1||k===4)targetScreen(k===1?'🔮 Seherin prüft eine Rolle':'😉 Heimlicher Blick','peekRole');
 if(k===2)targetScreen('🧙 Hexe wählt eine Person','witchTarget');
 if(k===3)targetScreen('🦹 Dieb wählt eine Person zum Tauschen','thiefSwap');
 if(k===5)targetScreen('💘 Amor wählt die erste verliebte Person','amorFirst');
}
function nightTarget(i){state.dead=i;nightScreen()}
function peekRole(i){
 screen(`<h3>Geheimer Blick</h3><div class="result">Spieler ${i+1}: <b>${esc(state.roles[i])}</b></div>
 ${btn('Rolle verdecken →','nightScreen()')}`);
}
function witchTarget(i){
 screen(`<h3>🧙 Hexe</h3><p>Spieler ${i+1} wurde ausgewählt.</p>
 <div class="grid">
 ${btn('Diese Person vergiften','poisonPlayer('+i+')')}
 ${btn('Opfer retten','saveVictim()','secondary')}
 ${btn('Nichts tun','nightScreen()','secondary')}
 </div>`);
}
function poisonPlayer(i){
 if(state.usedPoison){alert('Der Gifttrank wurde schon benutzt.');return nightScreen()}
 state.usedPoison=true;state.poison=i;nightScreen();
}
function saveVictim(){
 if(state.usedSave){alert('Der Heiltrank wurde schon benutzt.');return nightScreen()}
 state.usedSave=true;state.dead=null;nightScreen();
}
function thiefSwap(i){
 let me=state.roles.findIndex((r,j)=>r.includes('Dieb')&&!state.out.includes(j));
 if(me<0){screen(`<p>Es gibt keinen lebenden Dieb.</p>${btn('Weiter','nightScreen()')}`);return}
 [state.roles[me],state.roles[i]]=[state.roles[i],state.roles[me]];
 screen(`<h3>🦹 Rollentausch</h3><p>Die Rollen von Spieler ${me+1} und Spieler ${i+1} wurden getauscht.</p>
 ${btn('Weiter →','nightScreen()')}`);
}
function amorFirst(i){
 state.love1=i;
 targetScreen('💘 Amor wählt die zweite Person','amorSecond',[i]);
}
function amorSecond(i){
 state.lovers=[state.love1,i];
 screen(`<h3>💘 Verliebte verbunden</h3><p>Spieler ${state.love1+1} und ${i+1} sind heimlich verbunden.</p>
 ${btn('Weiter →','nightScreen()')}`);
}
function dayIntro(){
 let victims=[state.dead,state.poison].filter(i=>i!==null&&i!==undefined);
 victims=[...new Set(victims)];
 victims.forEach(i=>{if(!state.out.includes(i))state.out.push(i)});
 if(state.lovers&&victims.some(i=>state.lovers.includes(i))){
  state.lovers.forEach(i=>{if(!state.out.includes(i))state.out.push(i)});
 }
 screen(`<div class="big">🌅 Das Dorf erwacht</div>
 <div class="result">${victims.length?'Nachts ausgeschieden: '+victims.map(i=>'Spieler '+(i+1)).join(', '):'Niemand ist nachts ausgeschieden.'}
 </div><p>Diskutiert gemeinsam und stimmt ab.</p>
 ${btn('Zur Abstimmung →','wolfVote()')}`);
}
function wolfVote(){
 let alive=alivePlayers();
 if(alive.length<=1)return wolfEnd();
 screen(`<h3>Wen wählt das Dorf raus?</h3><div class="grid">${
 alive.map(i=>`<button onclick="wolfEliminate(${i})">👤 Spieler ${i+1}</button>`).join('')
 }</div>`);
}
function wolfEliminate(i){
 if(!state.out.includes(i))state.out.push(i);
 let role=state.roles[i],hunter=role.includes('Jäger');
 if(state.lovers&&state.lovers.includes(i)){
  state.lovers.forEach(j=>{if(!state.out.includes(j))state.out.push(j)});
 }
 screen(`<div class="big">${role.split(' ')[0]}</div>
 <h3>Spieler ${i+1} ist ausgeschieden</h3>
 <div class="result">Die Rolle war: <b>${esc(role)}</b></div>
 ${hunter?`<p>🏹 Der Jäger nimmt eine Person mit!</p>
 <div class="grid">${alivePlayers().map(j=>`<button onclick="hunterShot(${j})">Spieler ${j+1}</button>`).join('')}</div>`
 :btn('Weiter →','wolfContinue()')}`);
}
function hunterShot(i){
 state.out.push(i);
 if(state.lovers&&state.lovers.includes(i))state.lovers.forEach(j=>{if(!state.out.includes(j))state.out.push(j)});
 screen(`<h3>🏹 Der Jäger hat geschossen!</h3>
 <div class="result">Spieler ${i+1} scheidet aus. Rolle: <b>${esc(state.roles[i])}</b></div>
 ${btn('Weiter →','wolfContinue()')}`);
}
function wolfContinue(){
 let alive=alivePlayers();
 let wolves=alive.filter(i=>state.roles[i].includes('Werwolf')).length;
 if(wolves===0||wolves>=alive.length-wolves){wolfEnd();return}
 state.night++;state.dead=null;state.poison=null;nightIntro();
}
function wolfEnd(){
 let alive=alivePlayers();
 let wolves=alive.filter(i=>state.roles[i].includes('Werwolf')).length;
 let town=wolves===0;
 screen(`<div class="big">${town?'🏆':'🐺'}</div>
 <h2>${town?'Das Dorf gewinnt!':'Die Werwölfe gewinnen!'}</h2>
 <div class="result">Verbliebene Personen: ${alive.length}<br>Werwölfe: ${wolves}</div>
 ${btn('Neue Runde ↻',"openGame('werewolf')")}`);
 reward(town?70:25);
}

/* 3. TIC-TAC-TOE */
function startTic(){
 state={board:Array(9).fill(''),turn:'X',done:false};
 drawTic();
}
function drawTic(){
 let b=state.board;
 screen(`<h3>${state.done?'Runde beendet':'Am Zug: '+(state.turn==='X'?'Spieler 1 ❎':'Spieler 2 ⭕')}</h3>
 <div class="tic">${b.map((v,i)=>`<button ${v||state.done?'disabled':''} onclick="ticMove(${i})">${v}</button>`).join('')}</div>
 <p id="ticMsg" class="muted">Zwei Personen an einem Gerät.</p>
 ${btn('Neu starten ↻',"openGame('tic')",'secondary')}`);
}
function ticMove(i){
 if(state.board[i]||state.done)return;
 state.board[i]=state.turn;
 let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 let win=lines.some(line=>line.every(j=>state.board[j]===state.turn));
 if(win||state.board.every(Boolean)){
  state.done=true;drawTic();
  $('ticMsg').textContent=win?'Spieler '+(state.turn==='X'?'1':'2')+' gewinnt!':'Unentschieden!';
  if(win)reward(50);else reward(10);
 }else{state.turn=state.turn==='X'?'O':'X';drawTic()}
}

/* 4. QUIZ */
const questions=[
 {q:'Welcher Planet ist der größte?',a:['Mars','Jupiter','Venus','Merkur'],c:1},
 {q:'Wie viele Seiten hat ein Hexagon?',a:['5','6','7','8'],c:1},
 {q:'Was ist die Hauptstadt von Japan?',a:['Seoul','Peking','Tokio','Bangkok'],c:2},
 {q:'Welche Farbe entsteht aus Blau und Gelb?',a:['Lila','Grün','Orange','Rosa'],c:1},
 {q:'Wie viele Minuten hat eine Stunde?',a:['30','45','60','90'],c:2},
 {q:'Welches Tier ist ein Säugetier?',a:['Hai','Delfin','Forelle','Krabbe'],c:1},
 {q:'Wie heißt unser Stern?',a:['Mond','Sirius','Sonne','Polarstern'],c:2},
 {q:'Wie viele Beine hat eine Spinne?',a:['6','8','10','12'],c:1}
];
function startQuiz(){
 state={i:0,score:0,qs:shuffle([...questions]).slice(0,5)};
 showQuestion();
}
function showQuestion(){
 let q=state.qs[state.i];
 screen(`<div class="progress"><div style="width:${state.i/state.qs.length*100}%"></div></div>
 <p>Frage ${state.i+1} von ${state.qs.length}</p><h3>${q.q}</h3>
 <div class="grid">${q.a.map((a,i)=>`<button onclick="answerQuiz(${i})">${a}</button>`).join('')}</div>
 <p class="muted">Punkte: ${state.score}</p>`);
}
function answerQuiz(i){
 let q=state.qs[state.i],ok=i===q.c;
 if(ok)state.score++;
 screen(`<h3>${ok?'✅ Richtig!':'❌ Nicht ganz'}</h3>
 <div class="result">Die richtige Antwort ist <b>${q.a[q.c]}</b>.</div>
 ${btn(state.i+1<state.qs.length?'Nächste Frage →':'Ergebnis anzeigen →','nextQuestion()')}`);
}
function nextQuestion(){
 state.i++;
 if(state.i>=state.qs.length){
  screen(`<div class="big">⚡ ${state.score}/${state.qs.length}</div>
  <h2>Quiz beendet!</h2><p>Du hast ${state.score} Fragen richtig beantwortet.</p>
  ${btn('Nochmal spielen ↻',"openGame('quiz' )")}`);
  reward(10+state.score*10);return;
 }
 showQuestion();
}

/* 5. ZEICHNEN & RATEN */
const drawWords=['Katze','Rakete','Pizza','Roboter','Einhorn','Sonne','Dinosaurier','Fahrrad','Krone','Schneemann'];
function startDraw(){
 state={word:pick(drawWords)};
 screen(`<p>Der Zeichner schaut auf den geheimen Begriff und zeichnet ihn. Die anderen raten!</p>
 <div class="secret"><div><p>GEHEIMBEGRIFF FÜR DEN ZEICHNER</p><div class="big">${state.word}</div></div></div>
 <label>Zeichenfarbe</label><input id="penColor" type="color" value="#222222">
 <label>Stiftgröße</label><input id="penSize" type="range" min="2" max="20" value="5">
 <canvas id="drawCanvas" width="900" height="400"></canvas>
 <div class="row" style="margin-top:12px">
 ${btn('Zeichenfläche leeren','clearCanvas()','secondary')}
 ${btn('Begriff erraten!','drawGuess()')}
 </div>`);
 initCanvas();
}
let ctx,painting=false,last=null;
function initCanvas(){
 let c=$('drawCanvas');ctx=c.getContext('2d');
 ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
 c.onpointerdown=e=>{painting=true;last=canvasPoint(e,c);c.setPointerCapture(e.pointerId)};
 c.onpointerup=()=>{painting=false;last=null};
 c.onpointermove=e=>{
  if(!painting)return;
  let p=canvasPoint(e,c);
  ctx.strokeStyle=$('penColor').value;ctx.lineWidth=+$('penSize').value;
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
 };
}
function canvasPoint(e,c){
 let r=c.getBoundingClientRect();
 return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};
}
function clearCanvas(){
 ctx.fillStyle='white';ctx.fillRect(0,0,900,400);
}
function drawGuess(){
 screen(`<h3>Was wurde gezeichnet?</h3>
 <p>Zeigt die Zeichnung allen und lasst sie raten.</p>
 <input id="drawAnswer" placeholder="Geratener Begriff">
 ${btn('Antwort prüfen','checkDraw()')}`);
}
function checkDraw(){
 let ans=$('drawAnswer').value.trim().toLowerCase();
 let ok=ans===state.word.toLowerCase();
 screen(`<div class="big">${ok?'🎉':'🎨'}</div>
 <h3>${ok?'Richtig geraten!':'Auflösung'}</h3>
 <p>Der Begriff war <b>${state.word}</b>.</p>
 ${btn('Neue Runde ↻',"openGame('draw')")}`);
 reward(ok?35:10);
}

/* 6. MEMORY */
const memIcons=['🌙','⚡','🎮','👾','🍕','🚀','🐸','💎'];
function startMemory(){
 state={cards:shuffle([...memIcons,...memIcons]),open:[],matched:[],turns:0,locked:false};
 drawMemory();
}
function drawMemory(){
 screen(`<p>Finde alle acht Paare. Versuche, möglichst wenige Züge zu machen.</p>
 <div class="memory">${state.cards.map((v,i)=>`
 <button ${state.matched.includes(i)?'disabled':''} onclick="flipMemory(${i})">
 ${state.matched.includes(i)||state.open.includes(i)?v:'✦'}
 </button>`).join('')}</div>
 <p class="muted">Paare: ${state.matched.length/2}/8 · Züge: ${state.turns}</p>
 ${btn('Neu mischen ↻',"openGame('memory')",'secondary')}`);
}
function flipMemory(i){
 if(state.locked||state.matched.includes(i)||state.open.includes(i))return;
 state.open.push(i);drawMemory();
 if(state.open.length===2){
  state.turns++;
  let [a,b]=state.open;
  if(state.cards[a]===state.cards[b]){
   state.matched.push(a,b);state.open=[];drawMemory();
   if(state.matched.length===state.cards.length){
    screen(`<div class="big">🧠 Geschafft!</div>
    <h3>Alle Paare gefunden</h3><p>Du hast ${state.turns} Züge gebraucht.</p>
    ${btn('Nochmal spielen ↻',"openGame('memory')")}`);
    reward(40);
   }
  }else{
   state.locked=true;
   setTimeout(()=>{state.open=[];state.locked=false;drawMemory()},850);
  }
 }
}

/* 7. SCHERE-STEIN-PAPIER */
function startRPS(){
 screen(`<h3>Du gegen den Computer</h3><p>Wer gewinnt die Runde?</p>
 <div class="grid">
 <button onclick="playRPS('Stein')">✊ Stein</button>
 <button onclick="playRPS('Papier')">✋ Papier</button>
 <button onclick="playRPS('Schere')">✌️ Schere</button>
 </div><div id="rpsResult"></div>
 ${btn('Neues Duell ↻',"openGame('rps')",'secondary')}`);
}
function playRPS(m){
 let c=pick(['Stein','Papier','Schere']);
 let win=m!==c&&(
  (m==='Stein'&&c==='Schere')||
  (m==='Papier'&&c==='Stein')||
  (m==='Schere'&&c==='Papier')
 );
 let tie=m===c;
 $('rpsResult').innerHTML=`<div class="result">Du: <b>${m}</b><br>Computer: <b>${c}</b><h3>${tie?'Unentschieden':win?'Du gewinnst!':'Computer gewinnt!'}</h3></div>`;
 reward(win?25:10);
}

/* 8. WORTDUELL */
const wordBank=['KOMET','PIXEL','DRACHE','GALAXIE','ROBOTER','KAKTUS','SCHOKO','ARCADE','MOND','PIRAT'];
function startWord(){
 state={word:pick(wordBank),guessed:[],tries:7,done:false};
 drawWord();
}
function drawWord(){
 let masked=[...state.word].map(c=>state.guessed.includes(c)?c:'_').join(' ');
 screen(`<h3>Errate das Wort</h3>
 <p>Du hast ${state.tries} Fehlversuche.</p>
 <div class="big" style="letter-spacing:6px">${masked}</div>
 <div class="grid">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>
 `<button ${state.guessed.includes(c)||state.done?'disabled':''} onclick="guessLetter('${c}')">${c}</button>`
 ).join('')}</div>
 <p class="muted">Benutzte Buchstaben: ${state.guessed.join(' · ')||'Noch keine'}</p>
 ${btn('Neues Wort ↻',"openGame('word')",'secondary')}`);
}
function guessLetter(c){
 if(state.done||state.guessed.includes(c))return;
 state.guessed.push(c);
 if(!state.word.includes(c))state.tries--;
 let won=[...state.word].every(x=>state.guessed.includes(x));
 if(won||state.tries<=0){
  state.done=true;
  screen(`<div class="big">${won?'🔤':'💡'}</div>
  <h3>${won?'Richtig erraten!':'Versuche aufgebraucht'}</h3>
  <div class="result">Das Wort war <b>${state.word}</b>.</div>
  ${btn('Weiteres Wort ↻',"openGame('word')")}`);
  reward(won?35:10);return;
 }
 drawWord();
}
