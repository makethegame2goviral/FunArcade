<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunArcade v4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070a16;--line:#2b3760;--cyan:#4dfcff;--pink:#ff4fd8;--purple:#9271ff;--muted:#a7b0ce}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#070a16,#131a38,#070a16);background-size:200% 200%;animation:bg 18s ease infinite;color:#f5f7ff;font-family:system-ui,sans-serif}@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #3a4a7a;border-radius:12px;background:#161d38;color:#fff;padding:10px 14px;transition:.2s}button:hover{border-color:var(--cyan);box-shadow:0 0 18px #4dfcff40;transform:translateY(-1px)}.primary{background:linear-gradient(100deg,#5446e8,#b52fd0);border:0;font-weight:800}input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a0f22;color:#fff;margin:6px 0 12px}header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263050;background:#080c1ccc;position:sticky;top:0;backdrop-filter:blur(12px);z-index:5}.logo{font-weight:900;color:var(--cyan);text-shadow:0 0 18px #4dfcff55}.logo span{color:var(--pink)}.wrap{max-width:1200px;margin:auto;padding:20px 16px 60px}.panel{background:#11172bdd;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;transition:.2s}.panel:hover{border-color:#3d4f85}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{padding:9px 14px;border-radius:999px}.tab.active{background:linear-gradient(100deg,#5446e8,#b52fd0);border-color:transparent;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:#0b1022;border:1px solid #2b3760;border-radius:14px;padding:14px;transition:.2s}.stat:hover{border-color:var(--cyan)}.stat strong{display:block;font-size:24px;color:var(--cyan)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.result{min-height:22px;color:var(--cyan);font-weight:700;margin:10px 0}.pill{font-size:12px;color:var(--cyan);border:1px solid #31566b;padding:4px 9px;border-radius:999px}.hidden{display:none!important}#auth{max-width:430px;margin:60px auto}.chat{height:260px;overflow:auto;background:#0a0f22;border:1px solid var(--line);border-radius:12px;padding:10px}.msg{padding:8px 0;border-bottom:1px solid #273254}.board{display:grid;grid-template-columns:repeat(4,70px);gap:6px;justify-content:center}.tile{height:70px;display:grid;place-items:center;background:#151c35;border-radius:10px;font-weight:800}.game-card{background:linear-gradient(145deg,#182042,#0d1225);border:1px solid #2b3760;border-radius:16px;padding:16px;text-align:center}</style></head><body><header><div class="logo">FUN<span>ARCADE</span> V4</div><div id="account"></div></header><main class="wrap"><section id="auth" class="panel"><h2>Anmelden</h2><p class="muted">Nur Admin-Konten können das V4-Center nutzen.</p><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button class="primary" onclick="login()">Anmelden</button><div id="authMsg" class="result"></div></section><section id="app" class="hidden"><div class="tabs" id="tabs"></div><section id="home" class="panel"><h2 id="welcome"></h2><div class="grid" id="stats"></div><h3>🎁 Bonus-Spiele</h3><div class="row"><button class="primary" onclick="open2048()">2048 spielen</button><button onclick="openReaction()">Reaktionstest</button></div><div id="gameArea"></div></section><section id="players" class="panel hidden"><h2>👥 Spieler verwalten</h2><input id="playerSearch" placeholder="Spieler suchen…" oninput="renderPlayers()"><div id="playerList"></div><div id="playerEditor"></div></section><section id="leaderboard" class="panel hidden"><h2>🏆 Rangliste</h2><div id="leaderboardList"></div><button onclick="loadLeaderboard()">Aktualisieren</button></section><section id="gameboard" class="panel hidden"><h2>🎮 Rangliste pro Spiel</h2><div id="gameBoardList"></div><button onclick="loadGameBoard()">Aktualisieren</button></section><section id="rooms" class="panel hidden"><h2>🎮 Räume</h2><div id="roomsList"></div><button onclick="loadRooms()">Aktualisieren</button></section><section id="chat" class="panel hidden"><h2>💬 Raum-Chat</h2><div id="chatList" class="chat"></div><textarea id="chatInput" placeholder="Nachricht…"></textarea><button class="primary" onclick="sendChat()">Senden</button></section><section id="adminchat" class="panel hidden"><h2>🛡️ Admin-Chat</h2><div id="adminChatList" class="chat"></div><textarea id="adminChatInput" placeholder="Nur für Admins…"></textarea><button class="primary" onclick="sendAdminChat()">Senden</button></section><section id="admins" class="panel hidden"><h2>🛡️ Admins</h2><div class="row"><input id="adminName" placeholder="Spielername"><button class="primary" onclick="addAdmin()">Mini-Admin ernennen</button></div><div id="adminList"></div></section></section></main><script>"use strict";const SUPABASE_URL="https://qznkudfhmegfriwqdvmj.supabase.co",SUPABASE_KEY="sb_publishable_CPz52i2XcyThttYOrlKMAw_Pd3PYRmB";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let user=null,role="mini",admins=[],players=[],selected=null;const tabs=["home","leaderboard","gameboard","rooms","chat","adminchat","players","admins"];const labels={home:"🏠 Start",leaderboard:"🏆 Rangliste",gameboard:"🎮 Spiel-Rangliste",rooms:"🎮 Räume",chat:"💬 Chat",adminchat:"🛡️ Admin-Chat",players:"👥 Spieler",admins:"👑 Admins"};function badge(r){return r==="haupt"?" 👑":" 🛡️"}function roleName(r){return r==="haupt"?"👑 Haupt-Admin":"🛡️ Mini-Admin"}async function getNames(ids){if(!ids.length)return{};const {data}=await db.from("profiles").select("id,username").in("id",ids);return Object.fromEntries((data||[]).map(p=>[p.id,p.username]))}function renderTabs(){$("tabs").innerHTML=tabs.map(t=>`<button class="tab ${t==="home"?"active":""}" data-tab="${t}">${labels[t]}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tabs.forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));({leaderboard:loadLeaderboard,gameboard:loadGameBoard,rooms:loadRooms,chat:loadChat,adminchat:loadAdminChat,players:loadPlayers,admins:loadAdmins}[b.dataset.tab]||(()=>{}))()})}async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return $("authMsg").textContent="Bitte E-Mail und Passwort eingeben.";$("authMsg").textContent="Anmeldung läuft…";const {data,error}=await db.auth.signInWithPassword({email,password});if(error)return $("authMsg").textContent=error.message;user=data.user;const {data:admin,error:adminError}=await db.from("admin_users").select("user_id,created_at").eq("user_id",user.id).maybeSingle();if(adminError){await db.auth.signOut();user=null;return $("authMsg").textContent="Admin-Status konnte nicht geprüft werden: "+adminError.message}if(!admin){await db.auth.signOut();user=null;return $("authMsg").textContent="Kein Admin-Konto."}const {data:allAdmins}=await db.from("admin_users").select("user_id,created_at").order("created_at");admins=allAdmins||[{user_id:user.id,created_at:admin.created_at}];role=admins[0]?.user_id===user.id?"haupt":"mini";$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("welcome").innerHTML=`Willkommen ${esc(user.email)} ${badge(role)} ${roleName(role)}`;$("account").innerHTML=`<span class="muted">${esc(user.email)}</span> <button onclick="logout()">Abmelden</button>`;renderTabs();loadOverview();loadAdmins()}async function logout(){await db.auth.signOut();location.reload()}async function loadOverview(){const {data:p}=await db.from("arcade_player_data").select("xp,rounds,banned");players=p||[];const {data:r}=await db.from("rooms").select("id");$("stats").innerHTML=`<div class=stat><strong>${players.length}</strong><small>Spieler</small></div><div class=stat><strong>${players.reduce((s,x)=>s+(x.xp||0),0)}</strong><small>XP</small></div><div class=stat><strong>${players.reduce((s,x)=>s+(x.rounds||0),0)}</strong><small>Runden</small></div><div class=stat><strong>${players.filter(x=>x.banned).length}</strong><small>Gesperrt</small></div><div class=stat><strong>${r?.length||0}</strong><small>Räume</small></div>`}async function loadPlayers(){const {data,error}=await db.from("arcade_player_data").select("user_id,username,xp,level,rounds,best,banned").order("xp",{ascending:false});if(error)return $("playerList").textContent="Fehler: "+error.message;players=data||[];renderPlayers()}function renderPlayers(){const q=($("playerSearch").value||"").toLowerCase();const list=players.filter(p=>(p.username||"").toLowerCase().includes(q));$("playerList").innerHTML=list.length?`<table><thead><tr><th>Spieler</th><th>XP</th><th>Level</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.username)}</td><td>${p.xp}</td><td>${p.level}</td><td>${p.banned?"🔴":"🟢"}</td><td><button onclick=editPlayer('${p.user_id}')>Bearbeiten</button></td></tr>`).join("")}</tbody></table>`:"<p class=muted>Keine Spieler.</p>"}function editPlayer(id){selected=players.find(p=>p.user_id===id);if(!selected)return;$("playerEditor").innerHTML=`<hr><h3>${esc(selected.username)}</h3><div class=grid><div><label>XP</label><input id=eXp type=number value=${selected.xp}></div><div><label>Level</label><input id=eLevel type=number value=${selected.level}></div><div><label>Runden</label><input id=eRounds type=number value=${selected.rounds}></div><div><label>Bestwert</label><input id=eBest type=number value=${selected.best}></div></div><div class=row><button class=primary onclick=savePlayer()>Speichern</button><button onclick=toggleBan()>${selected.banned?"Entsperren":"Sperren"}</button><button onclick=makeAdmin()>Mini-Admin machen</button>${role==="haupt"?"<button class=primary onclick=resetPassword()>Temporäres Passwort setzen</button>":""}</div><div id=playerMsg class=result></div>`}async function savePlayer(){const {error}=await db.from("arcade_player_data").update({xp:Math.max(0,+$("eXp").value||0),level:Math.max(1,+$("eLevel").value||1),rounds:Math.max(0,+$("eRounds").value||0),best:Math.max(0,+$("eBest").value||0)}).eq("user_id",selected.user_id);$("playerMsg").textContent=error?error.message:"Gespeichert ✅";loadPlayers()}async function toggleBan(){const {error}=await db.from("arcade_player_data").update({banned:!selected.banned}).eq("user_id",selected.user_id);$("playerMsg").textContent=error?error.message:"Status geändert ✅";loadPlayers()}async function makeAdmin(){const {error}=await db.from("admin_users").insert({user_id:selected.user_id});$("playerMsg").textContent=error?error.message:"Mini-Admin ernannt 🛡️"}async function resetPassword(){if(role!=="haupt")return;$("playerMsg").textContent="Temporäres Passwort wird gesetzt…";const {data:{session}}=await db.auth.getSession();const res=await fetch(`${SUPABASE_URL}/functions/v1/admin-reset-password`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({targetUserId:selected.user_id})});const j=await res.json();$("playerMsg").textContent=j.temporaryPassword?`Temporäres Passwort: ${j.temporaryPassword}`:(j.error||"Fehler")}async function loadLeaderboard(){const {data,error}=await db.from("arcade_player_data").select("username,xp,level,rounds,best").order("xp",{ascending:false}).limit(50);if(error)return $("leaderboardList").textContent="Fehler: "+error.message;const m=["🥇","🥈","🥉"];$("leaderboardList").innerHTML=`<table><thead><tr><th>#</th><th>Spieler</th><th>XP</th><th>Level</th><th>Runden</th><th>Bestwert</th></tr></thead><tbody>${(data||[]).map((p,i)=>`<tr><td>${m[i]||i+1}</td><td>${esc(p.username)}</td><td>${p.xp}</td><td>${p.level}</td><td>${p.rounds}</td><td>${p.best}</td></tr>`).join("")}</tbody></table>`}async function loadGameBoard(){const {data,error}=await db.from("arcade_game_records").select("game_id,username,best_score,best_time_ms,plays,updated_at").order("game_id").order("best_score",{ascending:false});if(error)return $("gameBoardList").textContent="Fehler: "+error.message;const groups={};(data||[]).forEach(r=>{(groups[r.game_id]??=[]).push(r)});$("gameBoardList").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([game,rows])=>`<div class=game-card><h3>${esc(game)}</h3><table><thead><tr><th>#</th><th>Spieler</th><th>Bestwert</th><th>Plays</th><th>Beste Zeit</th></tr></thead><tbody>${rows.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.username)}</td><td>${r.best_score}</td><td>${r.plays}</td><td>${r.best_time_ms?r.best_time_ms+" ms":"-"}</td></tr>`).join("")}</tbody></table></div>`).join(""):"<p class=muted>Noch keine Spiel-Highscores.</p>"}async function loadRooms(){const {data,error}=await db.from("rooms").select("name,game,room_code,created_at").order("created_at",{ascending:false});if(error)return $("roomsList").textContent="Fehler: "+error.message;$("roomsList").innerHTML=(data||[]).map(r=>`<div class=panel><strong>${esc(r.name)}</strong> <span class=pill>${esc(r.room_code)}</span><p class=muted>${esc(r.game||"-")} · ${new Date(r.created_at).toLocaleString("de-DE")}</p></div>`).join("")||"<p class=muted>Keine Räume.</p>"}async function loadChat(){const {data,error}=await db.from("chat_messages").select("content,created_at,user_id,rooms(name)").order("created_at",{ascending:false}).limit(50);if(error)return $("chatList").textContent="Fehler: "+error.message;const names=await getNames([...new Set((data||[]).map(m=>m.user_id))]);$("chatList").innerHTML=(data||[]).map(m=>`<div class=msg><strong>${esc(names[m.user_id]||"Spieler")}</strong>${admins.some(a=>a.user_id===m.user_id)?badge(admins[0]?.user_id===m.user_id?"haupt":"mini"):""} <span class=muted>in ${esc(m.rooms?.name||"Raum")}</span><p>${esc(m.content)}</p></div>`).join("")||"<p class=muted>Keine Nachrichten.</p>"}async function sendChat(){const text=$("chatInput").value.trim();if(!text)return;const {data:room}=await db.from("rooms").select("id").eq("name","Allgemein").maybeSingle();if(!room)return alert("Kein Raum namens Allgemein gefunden.");await db.from("chat_messages").insert({room_id:room.id,user_id:user.id,content:text});$("chatInput").value="";loadChat()}async function getAdminRoom(){let {data:room}=await db.from("rooms").select("id").eq("name","ADMIN-CHAT").maybeSingle();if(!room){const {data:newRoom,error}=await db.from("rooms").insert({name:"ADMIN-CHAT",game:"Admin",owner_id:user.id}).select("id").single();if(error)throw error;room=newRoom}return room}async function loadAdminChat(){try{const room=await getAdminRoom();const {data,error}=await db.from("chat_messages").select("content,created_at,user_id").eq("room_id",room.id).order("created_at");if(error)return $("adminChatList").textContent="Fehler: "+error.message;const names=await getNames([...new Set((data||[]).map(m=>m.user_id))]);$("adminChatList").innerHTML=(data||[]).map(m=>{const r=admins.find(a=>a.user_id===m.user_id);const rr=r?(admins[0]?.user_id===m.user_id?"haupt":"mini"):"mini";return `<div class=msg><strong>${esc(names[m.user_id]||"Admin")}</strong>${badge(rr)}<p>${esc(m.content)}</p></div>`}).join("")||"<p class=muted>Noch keine Admin-Nachrichten.</p>"}catch(e){$("adminChatList").textContent="Fehler: "+e.message}}async function sendAdminChat(){const text=$("adminChatInput").value.trim();if(!text)return;try{const room=await getAdminRoom();const {error}=await db.from("chat_messages").insert({room_id:room.id,user_id:user.id,content:text});if(error)return alert(error.message);$("adminChatInput").value="";loadAdminChat()}catch(e){alert(e.message)}}async function loadAdmins(){const names=await getNames(admins.map(a=>a.user_id));$("adminList").innerHTML=`<table><thead><tr><th>Admin</th><th>Rolle</th><th>Seit</th></tr></thead><tbody>${admins.map((a,i)=>`<tr><td>${esc(names[a.user_id]||a.user_id)}</td><td>${roleName(i===0?"haupt":"mini")}</td><td>${new Date(a.created_at).toLocaleDateString("de-DE")}</td></tr>`).join("")}</tbody></table>`}async function addAdmin(){const name=$("adminName").value.trim();if(!name)return;const {data:profile,error}=await db.from("profiles").select("id").eq("username",name).maybeSingle();if(error||!profile)return alert("Spieler nicht gefunden.");const {error:err}=await db.from("admin_users").insert({user_id:profile.id});if(err)return alert(err.message);$("adminName").value="";const {data:a}=await db.from("admin_users").select("user_id,created_at").order("created_at");admins=a||admins;loadAdmins()}function open2048(){let b=Array(16).fill(0);const add=()=>{const f=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(f.length)b[f[Math.floor(Math.random()*f.length)]]=Math.random()<.9?2:4};add();add();const draw=()=>{$("gameArea").innerHTML=`<div class=board>${b.map(v=>`<div class=tile>${v||""}</div>`).join("")}</div><p class=muted>Pfeiltasten oder W/A/S/D</p>`};const move=dir=>{let changed=false;const line=i=>[i,i+1,i+2,i+3];for(let r=0;r<4;r++){let idx=dir==="left"?line(r*4):dir==="right"?[...line(r*4)].reverse():dir==="up"?[r,r+4,r+8,r+12]:[r+12,r+8,r+4,r];let vals=idx.map(i=>b[i]).filter(Boolean);for(let i=0;i<vals.length-1;i++)if(vals[i]===vals[i+1]){vals[i]*=2;vals.splice(i+1,1)}while(vals.length<4)vals.push(0);idx.forEach((v,i)=>{if(b[v]!==vals[i])changed=true;b[v]=vals[i]})}if(changed){add();draw()}};document.onkeydown=e=>{const k={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key];if(k){e.preventDefault();move(k)}};draw()}function openReaction(){let t;$("gameArea").innerHTML=`<button class=primary id=rb>Start</button><div id=rr class=result></div>`;$("rb").onclick=()=>{$("rr").textContent="Warte auf Grün…";$("rb").disabled=true;setTimeout(()=>{t=Date.now();$("rb").disabled=false;$("rb").textContent="JETZT!";$("rb").onclick=()=>{$("rr").textContent=`Deine Zeit: ${Date.now()-t} ms`;$("rb").textContent="Nochmal";openReaction()}},1000+Math.random()*2500)}}</script></body></html>
